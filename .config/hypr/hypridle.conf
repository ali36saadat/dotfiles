general {
    lock_cmd = sh -c 'hyprctl switchxkblayout all 0; pidof hyprlock || hyprlock'
    before_sleep_cmd = sh -c 'hyprctl switchxkblayout all 0; (pidof hyprlock || hyprlock) >/dev/null 2>&1 &'
    after_sleep_cmd = sh -c 'hyprctl switchxkblayout all 0; hyprctl dispatch dpms on'
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}